# Single-node Trino: the coordinator is also the only worker.
#
# Mounted over the image's own /etc/trino/config.properties ONE FILE AT A TIME,
# never as a directory -- a directory mount at /etc/trino would hide
# node.properties and the JVM security files that ship in the image and the
# server would not start. Same trap as ClickHouse's config.d (ADR-005 #9) and
# Flink's /opt/flink/lib (docker-compose.yml).
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# The stock file reads this from ${ENV:CATALOG_MANAGEMENT}. Since this file
# replaces the stock one, the variable is gone and the value is stated: static
# means catalogs come from files in /etc/trino/catalog, which is the one
# bind-mounted from analytics/trino/catalog/.
catalog.management=static

# Memory, and the arithmetic that has to hold.
#
# jvm.config derives a ~614m heap from 60% of the 1024m mem_limit. Trino
# validates at startup that query.max-memory-per-node +
# memory.heap-headroom-per-node fits inside the heap and REFUSES TO START
# otherwise, which is a better failure than Flink's (ADR-004 #8, where a
# mis-sized JobManager derived a 24 MB heap and only died later, during startup,
# with an OutOfMemoryError). 256 + 192 = 448 of 614.
#
# heap-headroom is memory Trino reserves for itself -- query planning, the
# result buffers, the catalog -- and is NOT available to queries. Its default is
# 30% of the heap; 192MB is 24%, bought back because this instance runs one
# query at a time against ~30K rows, not a concurrent workload.
query.max-memory=512MB
query.max-memory-per-node=256MB
memory.heap-headroom-per-node=192MB

# One query at a time. dbt runs with threads: 1 for the same reason -- this box
# has a 4 GB cap and the point of the slice is that the numbers are right, not
# that they arrive concurrently.
query.max-concurrent-queries=2
