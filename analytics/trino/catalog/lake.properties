# The Iceberg catalog -- and it is deliberately THE SAME ONE the Flink jobs
# write through, not a second catalog pointed at the same bucket.
#
# stream/flink/jobs/*.sql opens `CREATE CATALOG lake WITH ('catalog-type'='rest',
# 'uri'='http://iceberg-rest:8181', 'warehouse'='s3://lake/')`. Every value
# below matches it, and the file is named lake.properties so that Trino's
# catalog is also called `lake` -- which makes `lake.raw.trace_events` the same
# fully-qualified name in both engines. tests/test_analytics_project.py asserts
# the uri and warehouse here against the Flink SQL, because "one catalog, two
# engines" is the claim ADR-006 makes and a silent drift would falsify it while
# both engines carried on working against different warehouses.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://lake/

# Native S3 rather than the legacy hive-s3 filesystem. MinIO needs path-style
# addressing (the bucket in the path, not in the hostname) and a region the
# server ignores but the AWS SDK refuses to build a client without -- the same
# two facts ADR-004 #9 records for Flink's S3FileIO.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true

# ${ENV:...} is Trino's own indirection for exactly this: the credentials reach
# the process from docker-compose.yml's environment, so this file -- which is
# committed -- names them without containing them. Same reasoning as ADR-004 #9,
# which keeps MinIO's keys out of stream/flink/jobs/*.sql.
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
