version: 2

# The two Iceberg tables the Flink jobs write (ADR-004). Column lists here are
# not decoration: tests/test_analytics_project.py compares them against
# stream/flink/create_tables.py's RAW_SCHEMA and AGG_SCHEMA, which are in turn
# checked against contracts/trace_event_v1.avsc by
# tests/test_cold_path_contract.py. So a contract change that is not carried
# through to the analytics layer fails in CI rather than showing up as a column
# that quietly stopped being selected.
sources:
  - name: lake_raw
    database: lake
    schema: raw
    description: >
      Every TraceEvent, append-only, hidden-partitioned by day(ts_epoch_ms).
      Written exclusively by stream/flink/jobs/01_raw_sink.sql.
    tables:
      - name: trace_events
        description: One row per span. No TTL -- this is the archive.
        columns:
          - name: trace_id
          - name: span_id
          - name: parent_span_id
          - name: session_id
          - name: event_type
          - name: model
          - name: prompt_tokens
          - name: completion_tokens
          - name: latency_ms
          - name: cost_usd
          - name: status
          - name: ts_epoch_ms
          - name: attributes

  # The Debezium changelog (ADR-007). Its own namespace, not lake.raw: ADR-006
  # #1's rule is one writer per table and its ownership table reads "lake.raw --
  # written by Flink". lake.cdc is written by scripts/cdc_land.py and by nothing
  # else, which keeps that sentence true rather than adding a footnote to it.
  #
  # Unlike lake_raw, this column list is not contract-locked -- there is no
  # .avsc behind it, because the CDC topics carry JSON rather than registry
  # Avro (ADR-007 #2). It is checked against scripts/cdc_land.py's CDC_SCHEMA by
  # tests/test_cdc.py instead, which is the same guarantee by a different route.
  - name: lake_cdc
    database: lake
    schema: cdc
    description: >
      The Debezium changelog for public.prompt_versions, landed verbatim by
      scripts/cdc_land.py -- one row per Kafka record, append-only and
      at-least-once. NOT a state table: resolve it with stg_prompt_versions,
      which takes the latest record per primary key. Reading this directly will
      double-count every row that was ever updated.
    tables:
      - name: prompt_versions
        description: >
          One Iceberg row per Debezium record. Tombstones, TRUNCATE (op='t')
          and logical-decoding messages (op='m') are counted by the lander and
          not landed -- none carries a row image, and a delete is already fully
          described by the op='d' record before its tombstone.
        columns:
          - name: op
          - name: source_lsn
          - name: source_tx_id
          - name: source_snapshot
          - name: source_ts
          - name: event_ts
          - name: ingest_ts
          - name: kafka_partition
          - name: kafka_offset
          - name: id
          - name: name
          - name: version
          - name: template_text
          - name: params_json
          - name: created_at
          - name: envelope_json

  - name: lake_curated
    database: lake
    schema: curated
    description: >
      Event-time 5-minute tumbling aggregates. Written exclusively by
      stream/flink/jobs/02_agg_model_5m.sql.
    tables:
      - name: agg_model_5m
        description: >
          Aggregates by (event_type, model) per closed 5-minute window. Carries
          no percentile -- Flink 1.20 has no percentile aggregate (ADR-004 #6),
          which is the gap fct_model_costs closes from raw.
        columns:
          - name: window_start
          - name: window_end
          - name: event_type
          - name: model
          - name: event_count
          - name: error_count
          - name: prompt_tokens_sum
          - name: completion_tokens_sum
          - name: cost_usd_sum
          - name: latency_sum_ms
          - name: latency_max_ms
