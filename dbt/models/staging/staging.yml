version: 2

# Generic test arguments are nested under `arguments:`, which is dbt 1.12's
# required form -- the old flat style still runs but emits
# MissingArgumentsPropertyInGenericTestDeprecation on every occurrence. `config:`
# stays a sibling of `arguments:`: severity is test configuration, not a test
# argument, and nesting it under arguments would silently make it a no-op.

models:
  - name: stg_trace_events
    description: >
      Every span, typed and projected. All 13 contract fields plus the derived
      columns the marts share. ts_epoch_ms is renamed to ts here -- the one
      rename, at the one projection boundary (ADR-005 #8's rule).
    columns:
      - name: span_id
        description: uuid4 hex, unique per span (ADR-000 #4).
        tests: [not_null, unique]
      - name: trace_id
        description: One trace per turn. count(distinct trace_id) IS the turn count.
        tests: [not_null]
      - name: session_id
        description: One conversation; also the Kafka partition key.
        tests: [not_null]
      - name: ts
        tests: [not_null]
      - name: event_type
        description: The Avro enum, which is genuinely closed -- so this test blocks.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [LLM_CALL, TOOL_CALL, RETRIEVAL, AGENT_STEP, GATEWAY, ERROR]
      - name: status
        description: >
          Free-form by contract. The SDK promotes whatever set(status=...) is
          handed it -- its own tests already cover "degraded" -- so this is a
          WARN, not a gate. A new status value is news, not a build failure;
          hard-failing here would make adding one a schema migration. This is
          also why every consumer in the repo tests status != 'ok' rather than
          status = 'error' (ADR-005 #2).
        tests:
          - accepted_values:
              arguments:
                values: [ok, error]
              config:
                severity: warn
      - name: latency_ms
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: tool_name
        description: >
          Never null: services/sdk/telemetry.py builds attributes as
          {"name": name, ...}, unconditionally, on every span. A null here means
          something is writing to the topic that is not the SDK.
        tests: [not_null]

  - name: stg_agg_model_5m
    description: >
      The streaming 5-minute aggregate, typed, with the mean it implies. Nothing
      downstream reads it -- it exists to be reconciled against raw, which is
      what tests/assert_streamed_agg_does_not_overcount.sql does.
    columns:
      - name: window_start
        tests: [not_null]
      - name: event_count
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
    tests:
      # A closed window is emitted exactly once per (event_type, model) group --
      # the window TVF is append-only, which is the whole reason the Iceberg
      # sink accepts it (see stream/flink/jobs/02_agg_model_5m.sql). A duplicate
      # here would mean the append guarantee broke.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [window_start, event_type, model]

  - name: stg_prompt_versions
    description: >
      The current state of public.prompt_versions, resolved from the Debezium
      changelog by taking the latest record per primary key. Deleted rows are
      KEPT, carrying is_deleted -- the facts they explain are historical, and
      dropping them would turn a retired prompt into the same "unknown" state
      that means the CDC lander is broken. See ADR-007 #4.
    columns:
      - name: prompt_version_id
        description: >
          The Postgres primary key, and this model's grain. Unique by
          construction, since ROW_NUMBER() partitions by it -- so a duplicate
          means the window function changed, not that the data did.
        tests: [not_null, unique]
      - name: version
        description: >
          The exact string services/gateway stamps into
          attributes['prompt_version'], and the join key of
          fct_cost_by_prompt. NOT NULL blocks: metadata/sql/02_prompt_versions.sql
          declares the column NOT NULL and REPLICA IDENTITY FULL keeps it
          populated even on a delete's before-image, so a null here can only
          mean the connector's replica identity regressed.
        tests: [not_null]
      - name: last_op
        description: >
          The Debezium operation of the winning record. Genuinely closed once
          the lander has dropped 't' (TRUNCATE) and 'm' (logical decoding
          message), neither of which carries a row image -- so unlike
          accepted_values on `status`, this one gates.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [c, u, d, r]
      - name: is_deleted
        tests: [not_null]
