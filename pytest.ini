[pytest]
# Repo root on sys.path so `import services.sdk` resolves under a bare `pytest`
# (tests/ has no __init__.py, so pytest would otherwise prepend tests/).
pythonpath = .
testpaths = tests

# Deliberately narrower than pytest's default of "test_*.py *_test.py":
# services/emit_test.py and services/consume_test.py are hour-one smoke scripts
# that build a Producer/Consumer/SchemaRegistryClient at module scope. Under the
# default pattern, collection alone would import them and open network
# connections. The suite must run with no Kafka.
python_files = test_*.py

asyncio_default_fixture_loop_scope = function
