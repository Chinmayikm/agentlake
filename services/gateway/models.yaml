# Model aliases and per-MTok pricing. cost_usd is computed from this table
# only -- never hardcoded in code (see services/gateway/pricing.py). version
# is stamped into every LLM_CALL span's attributes, so a cost figure can
# always be traced to the price table that produced it.
#
# Source: https://docs.claude.com/en/docs/about-claude/pricing (verified 2026-08-25)
version: "2026-09-standard"

aliases:
  fast:
    provider_model_id: claude-haiku-4-5
    input_price_per_mtok: 1.00
    output_price_per_mtok: 5.00

  quality:
    provider_model_id: claude-sonnet-5
    # Standard rate. Launch pricing was 2.00/10.00 per MTok under price table
    # version "2026-08-intro" and ran through 2026-08-31; spans emitted in that
    # window carry that version and should be costed at the old rate. See
    # ADR-001 #2 -- this hand edit is the expiry mechanism, by design.
    input_price_per_mtok: 3.00
    output_price_per_mtok: 15.00
